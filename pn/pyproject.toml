[project]
name = "pn"
version = "0.1.0"
description = "PokerNow ingestion, player profiling, solver adapter, live assist"
requires-python = ">=3.13"
dependencies = ["requests>=2.32", "typer>=0.12", "rich>=13", "pydantic>=2", "numpy>=2", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2.2", "pillow>=10"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
pn = "pn.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pn"]

[tool.ruff]
line-length = 100
target-version = "py313"
